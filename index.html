<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>МТС | Портал обучения агентов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mts-red: #E30611;
            --mts-dark-red: #b5040d;
            --bg-deep: #050507;
            --glass-bg: rgba(20, 20, 25, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-muted: #94949D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимированный футуристичный фон */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(227, 6, 17, 0.12) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(227, 6, 17, 0.08) 0%, transparent 40%),
                        var(--bg-deep);
            overflow: hidden;
        }

        .bg-mesh::after {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            animation: grid-move 60s linear infinite;
        }

        @keyframes grid-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(32px, 32px); }
        }

        /* Экран блокировки (PIN Gate) */
        #pin-gate {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 7, 0.85);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s cubic-bezier(0.8, 0, 0.2, 1), visibility 0.6s;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-top: 3px solid var(--mts-red);
            padding: 40px 32px;
            border-radius: 28px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(227, 6, 17, 0.1);
            animation: card-appear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mts-badge {
            background: linear-gradient(135deg, var(--mts-red), var(--mts-dark-red));
            color: #fff;
            font-weight: 900;
            font-size: 24px;
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(227, 6, 17, 0.4);
            letter-spacing: 1px;
            animation: badge-pulse 3s infinite ease-in-out;
        }

        .auth-card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
        }

        .auth-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .pin-container {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .pin-digit {
            width: 48px;
            height: 60px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-align: center;
            outline: none;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .pin-digit:focus {
            border-color: var(--mts-red);
            background: rgba(227, 6, 17, 0.05);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(227, 6, 17, 0.3);
        }

        .pin-digit.success-border {
            border-color: #00C853;
            background: rgba(0, 200, 83, 0.1);
            color: #00C853;
        }

        .pin-digit.error-border {
            border-color: var(--mts-red);
            color: var(--mts-red);
            background: rgba(227, 6, 17, 0.15);
        }

        .error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        .pin-gate-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(1.05);
        }

        /* Основной контент сайта */
        #main-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease, transform 0.8s ease;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            display: none;
        }

        #main-content.visible {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .main-header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .main-header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 8px;
        }

        .main-header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Анимации */
        @keyframes card-appear {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes badge-pulse {
            0%, 100% { box-shadow: 0 10px 25px rgba(227, 6, 17, 0.4); }
            50% { box-shadow: 0 10px 35px rgba(227, 6, 17, 0.7); }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }
    </style>
</head>
<body>

    <div class="bg-mesh"></div>

    <!-- Экран блокировки с пин-кодом -->
    <div id="pin-gate">
        <div class="auth-card">
            <div class="mts-badge">МТС</div>
            <h2>Портал адаптации</h2>
            <p>Введите 5-значный код доступа агента</p>
            <div class="pin-container" id="pin-container">
                <input type="password" inputmode="numeric" class="pin-digit" maxlength="1" autocomplete="off">
                <input type="password" inputmode="numeric" class="pin-digit" maxlength="1" autocomplete="off">
                <input type="password" inputmode="numeric" class="pin-digit" maxlength="1" autocomplete="off">
                <input type="password" inputmode="numeric" class="pin-digit" maxlength="1" autocomplete="off">
                <input type="password" inputmode="numeric" class="pin-digit" maxlength="1" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- Основной контент (появится после верного пина) -->
    <div id="main-content">
        <div class="main-header">
            <h1>Добро пожаловать в команду, стажёр!</h1>
            <p>Система авторизована. Все материалы и инструкции разблокированы.</p>
        </div>
        <!-- Сюда можешь вставлять свои блоки со стажировкой -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pinGate = document.getElementById('pin-gate');
            const mainContent = document.getElementById('main-content');
            const pinInputs = document.querySelectorAll('.pin-digit');
            const pinContainer = document.getElementById('pin-container');
            const correctPin = '79124';

            if (sessionStorage.getItem('auth_passed') === 'true') {
                unlockPortalInstant();
            }

            function checkPin() {
                const enteredPin = Array.from(pinInputs).map(i => i.value).join('');
                if (enteredPin.length === 5) {
                    pinInputs.forEach(i => i.disabled = true);
                    if (enteredPin === correctPin) {
                        pinInputs.forEach(i => {
                            i.classList.remove('error-border');
                            i.classList.add('success-border');
                        });
                        sessionStorage.setItem('auth_passed', 'true');
                        setTimeout(unlockPortal, 600);
                    } else {
                        pinContainer.classList.add('error-shake');
                        pinInputs.forEach(i => i.classList.add('error-border'));
                        setTimeout(() => {
                            pinContainer.classList.remove('error-shake');
                            pinInputs.forEach(i => {
                                i.value = '';
                                i.disabled = false;
                                i.classList.remove('error-border');
                            });
                            pinInputs[0].focus();
                        }, 500);
                    }
                }
            }

            pinInputs.forEach((input, index) => {
                ['input', 'change', 'keyup'].forEach(eventType => {
                    input.addEventListener(eventType, () => {
                        input.value = input.value.replace(/\D/g, '');
                        if (input.value && index < pinInputs.length - 1) {
                            pinInputs[index + 1].focus();
                        }
                        checkPin();
                    });
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !input.value && index > 0) {
                        pinInputs[index - 1].focus();
                        pinInputs[index - 1].value = '';
                    }
                });
            });

            // Фокус на первый инпут при загрузке
            setTimeout(() => pinInputs[0].focus(), 100);

            function unlockPortal() {
                pinGate.classList.add('pin-gate-hidden');
                setTimeout(() => {
                    pinGate.style.display = 'none';
                    mainContent.style.display = 'block';
                    setTimeout(() => mainContent.classList.add('visible'), 50);
                }, 600);
            }

            function unlockPortalInstant() {
                pinGate.style.display = 'none';
                mainContent.style.display = 'block';
                mainContent.classList.add('visible');
            }
        });
    </script>
</body>
</html>
